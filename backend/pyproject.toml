[project]
name = "aso-light"
version = "0.1.0"
description = "ASO (App Store Optimization) SaaS tool"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "asyncpg",
    "aiosqlite",
    "pydantic-settings",
    "pydantic[email]",
    "bcrypt",
    "python-jose[cryptography]",
    "cryptography",
    "httpx",
    "openpyxl",
    "python-multipart",
    "PyJWT",
    "anthropic>=0.45.0",
    "fastmcp>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
