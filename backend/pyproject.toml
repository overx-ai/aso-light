[project]
name = "aso-light"
version = "0.1.0"
description = "Self-hosted App Store Optimization tool — pricing, metadata, keywords, reviews, and Apple Search Ads analytics"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Jack Ma" }]
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "asyncpg",
    "aiosqlite",
    "pydantic-settings",
    "pydantic[email]",
    "bcrypt",
    "python-jose[cryptography]",
    "cryptography",
    "httpx",
    "openpyxl",
    "python-multipart",
    "PyJWT",
    "anthropic>=0.45.0",
    "fastmcp>=2.0",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/overx-ai/aso-light"
Repository = "https://github.com/overx-ai/aso-light"
Issues = "https://github.com/overx-ai/aso-light/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
