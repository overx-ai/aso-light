name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: |
          # Generate a throwaway Fernet key per run — never commit a valid key
          # to this public repo. It only encrypts ephemeral CI test data.
          export FERNET_KEY=$(uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          uv run pytest -q
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          # CI-only throwaway secrets — must satisfy app.core.config.reject_weak_secret
          # (>= 32 chars, not a known placeholder). Never used in prod.
          SECRET_KEY: ci-secret-not-for-prod-0123456789abcdef
          JWT_SECRET_KEY: ci-jwt-secret-not-for-prod-0123456789abcdef

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run
