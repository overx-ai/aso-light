name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          # Must satisfy app.core.config.reject_weak_secret (>= 32 chars, not a
          # known placeholder) — CI-only throwaway values, never used in prod.
          SECRET_KEY: ci-secret-not-for-prod-0123456789abcdef
          JWT_SECRET_KEY: ci-jwt-secret-not-for-prod-0123456789abcdef
          FERNET_KEY: V6tNpIULWzIJpc-DEou34d5KtZqWJpwXILqRsWh28do=

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run
